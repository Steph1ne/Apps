<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relations</title>
<!-- Relations app - public shell v3, data stays in local JSON/localStorage -->
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0e0e10;color:#e8e8f0;font-family:'Courier New',monospace;font-size:14px;min-height:100vh;}
header{padding:12px 16px;border-bottom:1px solid #2a2a35;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:#0e0e10;z-index:100;}
.brand{font-family:Georgia,serif;font-size:19px;}.brand span{color:#c77dff;}
.tabs{display:flex;gap:3px;flex-wrap:wrap;}
.tab{padding:6px 9px;border:1px solid #2a2a35;background:transparent;color:#a0a0b8;font-family:'Courier New',monospace;font-size:10px;cursor:pointer;border-radius:4px;text-transform:uppercase;letter-spacing:0.5px;}
.tab.active{background:#c77dff;border-color:#c77dff;color:#fff;}
main{padding:14px;max-width:620px;margin:0 auto;}
.view{display:none;}.view.active{display:block;}
.prog-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.prog-label{color:#6b6b80;font-size:11px;text-transform:uppercase;letter-spacing:1px;}
.prog-bar{background:#2a2a35;height:3px;border-radius:2px;margin-bottom:18px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,#e8a838,#c77dff);transition:width 0.4s;}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.step-dot{width:10px;height:10px;border-radius:50%;border:1px solid #2a2a35;background:transparent;}
.step-dot.active{background:#e8a838;border-color:#e8a838;}
.step-dot.done{background:#4ea8de;border-color:#4ea8de;}
.dim-title{text-align:center;margin-bottom:18px;}
.dim-title h2{font-family:Georgia,serif;font-size:30px;font-weight:400;}
.dim-title p{color:#6b6b80;font-size:12px;margin-top:5px;}
.duel{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.choice-btn{background:#16161a;border:1px solid #2a2a35;border-radius:12px;padding:20px 16px;cursor:pointer;color:#e8e8f0;font-family:'Courier New',monospace;font-size:18px;text-align:center;width:100%;transition:all 0.15s;}
.choice-btn:active{border-color:#e8a838;background:#1e1e24;}
.choice-btn.prob:active{border-color:#4ea8de;}
.vs-sep{text-align:center;color:#3a3a45;font-size:11px;letter-spacing:2px;}
.sel-box{background:#1e1e24;border:1px solid #2a2a35;border-radius:8px;padding:9px 12px;margin-bottom:11px;display:flex;gap:14px;flex-wrap:wrap;}
.sel-item{display:flex;gap:5px;align-items:center;}
.sel-label{color:#6b6b80;font-size:10px;text-transform:uppercase;letter-spacing:1px;}
.sel-val-e{color:#e8a838;font-size:13px;}
.sel-val-empty{color:#3a3a45;font-size:13px;}
.action-row{display:flex;justify-content:center;}
.btn-ghost{padding:11px 26px;border-radius:8px;font-family:'Courier New',monospace;font-size:13px;cursor:pointer;border:1px solid #2a2a35;background:transparent;color:#6b6b80;}
.done-panel{background:#16161a;border:1px solid #2a2a35;border-radius:10px;padding:32px 16px;text-align:center;}
.done-panel h2{font-family:Georgia,serif;font-size:21px;font-weight:400;margin-bottom:9px;}
.done-panel p{color:#6b6b80;font-size:12px;margin-bottom:18px;}
.btn-primary{padding:11px 22px;border-radius:8px;font-family:'Courier New',monospace;font-size:13px;cursor:pointer;border:1px solid #c77dff;background:#c77dff;color:#fff;}
.card{background:#16161a;border:1px solid #2a2a35;border-radius:10px;overflow:hidden;margin-bottom:12px;}
.card-head{padding:11px 14px;border-bottom:1px solid #2a2a35;display:flex;align-items:center;gap:8px;}
.card-title{font-family:Georgia,serif;font-size:15px;font-weight:400;}
.card-sub{font-size:10px;color:#6b6b80;margin-top:1px;}
.section-title{font-family:Georgia,serif;font-size:16px;font-weight:400;margin-bottom:10px;}
.stats-bar{display:flex;gap:14px;flex-wrap:wrap;padding:11px 14px;background:#16161a;border:1px solid #2a2a35;border-radius:8px;margin-bottom:12px;}
.stat-val{font-family:Georgia,serif;font-size:19px;display:block;}
.stat-lab{font-size:10px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;}
.rank-grid{display:flex;flex-direction:column;gap:14px;}
.rank-item{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid #1a1a20;}
.rank-item:last-child{border-bottom:none;}
.rank-num{font-size:11px;color:#6b6b80;width:20px;text-align:right;flex-shrink:0;}
.rank-name{flex:1;font-size:13px;}
.rank-score{font-size:12px;flex-shrink:0;}
.rel-badge{font-size:9px;padding:1px 4px;border-radius:3px;margin-left:3px;vertical-align:middle;}
.rel-high{background:rgba(86,207,133,0.15);color:#56cf85;}
.rel-mid{background:rgba(232,168,56,0.15);color:#e8a838;}
.rel-low{background:rgba(255,107,107,0.15);color:#ff6b6b;}
.rank-legend{margin-top:10px;background:#16161a;border:1px solid #2a2a35;border-radius:8px;padding:11px 14px;}
.rank-legend-title{font-size:10px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.rank-legend-items{display:flex;flex-wrap:wrap;gap:7px;}
.rank-legend-item{font-size:12px;color:#a0a0b8;}
.weights-card{background:#16161a;border:1px solid #2a2a35;border-radius:10px;padding:14px;margin-bottom:12px;}
.weights-title{font-size:10px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.weight-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.weight-label{font-size:12px;width:120px;flex-shrink:0;}
.weight-slider{flex:1;accent-color:#c77dff;}
.weight-val{font-size:12px;color:#c77dff;width:36px;text-align:right;}
.weight-total{font-size:11px;text-align:right;margin-top:4px;}
.weight-total.ok{color:#56cf85;}.weight-total.err{color:#ff6b6b;}
.matrix-wrap{position:relative;width:100%;aspect-ratio:1;background:#16161a;border:1px solid #2a2a35;border-radius:10px;overflow:visible;margin-bottom:8px;}
.matrix-quadrant{position:absolute;display:flex;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;}
.mq-tl{top:0;left:0;width:50%;height:50%;border-right:1px solid #2a2a35;border-bottom:1px solid #2a2a35;align-items:flex-start;}
.mq-tr{top:0;right:0;width:50%;height:50%;border-bottom:1px solid #2a2a35;align-items:flex-start;justify-content:flex-end;}
.mq-bl{bottom:0;left:0;width:50%;height:50%;border-right:1px solid #2a2a35;align-items:flex-end;}
.mq-br{bottom:0;right:0;width:50%;height:50%;align-items:flex-end;justify-content:flex-end;}
.matrix-dot{position:absolute;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;cursor:pointer;transform:translate(-50%,50%);transition:all 0.2s;border:2px solid transparent;z-index:5;}
.matrix-dot:hover{z-index:15;transform:translate(-50%,50%) scale(1.3);}
.matrix-dot.selected{z-index:15;transform:translate(-50%,50%) scale(1.4);}
.matrix-label{position:absolute;background:#0e0e10;border-radius:6px;padding:5px 10px;font-size:11px;white-space:nowrap;z-index:20;pointer-events:none;transform:translate(-50%,0);bottom:calc(100% + 4px);}
.reco-card{background:#16161a;border:1px solid #2a2a35;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.reco-head{padding:10px 14px;border-bottom:1px solid #2a2a35;font-family:Georgia,serif;font-size:14px;}
.reco-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid #1a1a20;gap:8px;}
.reco-item:last-child{border-bottom:none;}
.reco-name{font-size:13px;flex:1;}
.reco-reason{font-size:11px;color:#6b6b80;}
.profile-card{background:#16161a;border:1px solid #2a2a35;border-radius:10px;overflow:hidden;margin-bottom:8px;}
.profile-head{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.profile-name{font-size:15px;}
.profile-scores{display:flex;gap:8px;font-size:11px;}
.profile-body{border-top:1px solid #2a2a35;padding:13px 14px;display:none;}
.profile-body.open{display:block;}
.rating-row{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.rating-label{font-size:11px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;}
.rating-desc{font-size:11px;color:#4ea8de;}
.rating-stars{display:flex;gap:5px;margin-top:3px;}
.star-btn{background:transparent;border:1px solid #2a2a35;border-radius:6px;padding:7px 11px;cursor:pointer;font-size:15px;transition:all 0.15s;color:#6b6b80;}
.star-btn.active{background:#c77dff;border-color:#c77dff;color:#fff;}
.next-step-label{font-size:11px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.next-step-input{width:100%;background:#1e1e24;border:1px solid #2a2a35;border-radius:7px;padding:9px 11px;color:#e8e8f0;font-family:'Courier New',monospace;font-size:13px;outline:none;resize:none;min-height:60px;}
.next-step-input:focus{border-color:#c77dff;}
.search-input{width:100%;background:#1e1e24;border:1px solid #2a2a35;border-radius:8px;padding:11px 14px;color:#e8e8f0;font-family:'Courier New',monospace;font-size:14px;outline:none;margin-bottom:10px;}
.search-input:focus{border-color:#c77dff;}
.person-exp-card{background:#16161a;border:1px solid #2a2a35;border-radius:10px;overflow:hidden;margin-bottom:8px;}
.person-exp-head{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.person-exp-name{font-size:15px;}
.person-exp-body{border-top:1px solid #2a2a35;padding:12px 14px;display:none;}
.person-exp-body.open{display:block;}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.exp-check{display:flex;align-items:center;gap:7px;padding:9px;border-radius:8px;cursor:pointer;border:1px solid #2a2a35;background:transparent;transition:all 0.15s;}
.exp-check.checked{border-color:#c77dff;background:rgba(199,125,255,0.1);}
.exp-check-emoji{font-size:17px;}
.exp-check-label{font-size:11px;color:#6b6b80;flex:1;}
.exp-check.checked .exp-check-label{color:#e8e8f0;}
.glossaire-card{background:#16161a;border:1px solid #2a2a35;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.glossaire-head{padding:9px 14px;border-bottom:1px solid #2a2a35;font-size:10px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;}
.glossaire-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid #1a1a20;}
.glossaire-item:last-child{border-bottom:none;}
.glos-emoji-input{background:#1e1e24;border:1px solid #2a2a35;border-radius:6px;padding:5px 7px;color:#e8e8f0;font-size:17px;width:50px;text-align:center;outline:none;font-family:inherit;}
.glos-label-input{flex:1;background:#1e1e24;border:1px solid #2a2a35;border-radius:6px;padding:7px 9px;color:#e8e8f0;font-family:'Courier New',monospace;font-size:12px;outline:none;}
.glos-emoji-input:focus,.glos-label-input:focus{border-color:#c77dff;}
.glos-del{background:transparent;border:none;color:#6b6b80;cursor:pointer;font-size:17px;padding:3px 5px;}
.btn-add-exp{width:100%;padding:11px;background:transparent;border:1px dashed #2a2a35;color:#6b6b80;border-radius:8px;font-family:'Courier New',monospace;font-size:12px;cursor:pointer;margin-bottom:14px;}
.history-item{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid #1a1a20;flex-wrap:wrap;}
.history-item:last-child{border-bottom:none;}
.history-vs{flex:1;font-size:13px;line-height:1.5;}
.history-redo{background:transparent;border:1px solid #2a2a35;color:#6b6b80;padding:5px 10px;border-radius:5px;font-family:'Courier New',monospace;font-size:10px;cursor:pointer;}
.add-form{background:#16161a;border:1px solid #2a2a35;border-radius:10px;padding:14px;margin-bottom:12px;}
.add-form h2{font-family:Georgia,serif;font-size:16px;font-weight:400;margin-bottom:3px;}
.add-form p{color:#6b6b80;font-size:11px;margin-bottom:12px;}
.field label{display:block;font-size:10px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.field input{width:100%;background:#1e1e24;border:1px solid #2a2a35;border-radius:8px;padding:11px 13px;color:#e8e8f0;font-family:'Courier New',monospace;font-size:15px;outline:none;margin-bottom:11px;}
.field input:focus{border-color:#c77dff;}
.person-list{background:#16161a;border:1px solid #2a2a35;border-radius:10px;overflow:hidden;margin-bottom:12px;}
.person-list-head{padding:9px 14px;border-bottom:1px solid #2a2a35;font-size:10px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;}
.person-row{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid #1a1a20;}
.person-row:last-child{border-bottom:none;}
.person-row.editing{background:#1e1e24;}
.person-name{flex:1;font-size:13px;}
.person-comps{font-size:10px;color:#6b6b80;}
.icon-btn{background:transparent;border:none;cursor:pointer;font-size:15px;padding:3px 5px;border-radius:3px;}
.edit-input{flex:1;background:#0e0e10;border:1px solid #4ea8de;border-radius:6px;padding:7px 11px;color:#e8e8f0;font-family:'Courier New',monospace;font-size:13px;outline:none;}
.btn-save{background:#4ea8de;border:none;color:#fff;padding:7px 13px;border-radius:6px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;}
.btn-cancel-sm{background:transparent;border:1px solid #2a2a35;color:#6b6b80;padding:7px 9px;border-radius:6px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;}
.reset-zone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:#16161a;border:1px solid #2a2a35;border-radius:8px;margin-bottom:12px;flex-wrap:wrap;}
.reset-zone p{color:#6b6b80;font-size:11px;flex:1;}
.btn-danger{background:transparent;border:1px solid rgba(255,107,107,0.4);color:#ff6b6b;padding:7px 13px;border-radius:6px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;}
.backup-zone{background:#16161a;border:1px solid #2a2a35;border-radius:8px;overflow:hidden;margin-bottom:12px;}
.backup-head{padding:9px 14px;border-bottom:1px solid #2a2a35;font-size:10px;color:#6b6b80;text-transform:uppercase;letter-spacing:1px;}
.backup-body{padding:11px 14px;display:flex;flex-direction:column;gap:9px;}
.backup-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.backup-row p{color:#6b6b80;font-size:11px;flex:1;}
.btn-export{background:transparent;border:1px solid #4ea8de;color:#4ea8de;padding:7px 13px;border-radius:6px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;white-space:nowrap;}
.btn-import-label{background:transparent;border:1px solid #e8a838;color:#e8a838;padding:7px 13px;border-radius:6px;font-family:'Courier New',monospace;font-size:11px;cursor:pointer;white-space:nowrap;display:inline-block;}
#import-file{display:none;}
.flash{position:fixed;bottom:18px;right:16px;background:#56cf85;color:#0e0e10;padding:9px 15px;border-radius:6px;font-size:12px;display:none;z-index:999;}
</style>
</head>
<body>
<header>
  <div class="brand">Relations<span>.</span></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('compare',this)">Comparer</button>
    <button class="tab" onclick="switchTab('rankings',this)">Classements</button>
    <button class="tab" onclick="switchTab('matrix',this)">Matrice</button>
    <button class="tab" onclick="switchTab('profiles',this)">Profils</button>
    <button class="tab" onclick="switchTab('experiences',this)">Vécu</button>
    <button class="tab" onclick="switchTab('history',this)">Historique</button>
    <button class="tab" onclick="switchTab('manage',this)">Gérer</button>
  </div>
</header>
<main>
  <div id="view-compare" class="view active"><div id="compare-content"></div></div>
  <div id="view-rankings" class="view"><div id="rankings-content"></div></div>
  <div id="view-matrix" class="view"><div id="matrix-content"></div></div>
  <div id="view-profiles" class="view"><div id="profiles-content"></div></div>
  <div id="view-experiences" class="view"><div id="exp-content"></div></div>
  <div id="view-history" class="view"><div id="history-content"></div></div>
  <div id="view-manage" class="view">
    <div class="add-form">
      <h2>Ajouter une personne</h2>
      <p>Elle sera intégrée dans les prochaines comparaisons.</p>
      <div class="field"><label>Prénom / Nom</label><input type="text" id="new-name" placeholder="ex. Personne A" onkeydown="if(event.key==='Enter')addPerson()"></div>
      <button class="btn-primary" onclick="addPerson()">Ajouter</button>
    </div>
    <div class="person-list" id="person-list"></div>
    <div class="reset-zone"><p>Réinitialiser tous les scores (noms conservés).</p><button class="btn-danger" onclick="resetScores()">Réinitialiser</button></div>
    <div class="backup-zone">
      <div class="backup-head">Sauvegarde JSON</div>
      <div class="backup-body">
        <div class="backup-row"><p>Exporte toutes tes données.</p><button class="btn-export" onclick="exportJSON()">↓ Exporter</button></div>
        <div class="backup-row"><p>Restaure une sauvegarde.</p><label class="btn-import-label" for="import-file">↑ Importer</label><input type="file" id="import-file" accept=".json" onchange="importJSON(event)"></div>
      </div>
    </div>
  </div>
</main>
<div class="flash" id="flash"></div>
<script>
// ===== DEFAULTS =====
const DEFAULT_PEOPLE=[]; // Donnees personnelles retirees du code public. Importer la sauvegarde JSON depuis l'onglet Gerer.
const DEFAULT_EXP=[{id:'e1',emoji:'☕',label:'Café / thé'},{id:'e2',emoji:'🍽️',label:'Repas'},{id:'e3',emoji:'🥂',label:'Soirée / verre'},{id:'e4',emoji:'🏃',label:'Sport ensemble'},{id:'e5',emoji:'🎵',label:'Musique / concert'},{id:'e6',emoji:'✈️',label:'Voyage'},{id:'e7',emoji:'💼',label:'Travail / projet pro'},{id:'e8',emoji:'🎓',label:'Formation ensemble'},{id:'e9',emoji:'🎉',label:'Événement / fête'},{id:'e10',emoji:'🤝',label:'Networking'},{id:'e11',emoji:'📞',label:'Appel / visio régulier'},{id:'e12',emoji:'🏠',label:'Reçue chez moi ou elle'}];
const MOMENTUM_ANCHORS=['','Aucun contact récent','Contact rare','Échanges occasionnels','Échanges réguliers','Contact actif cette semaine'];
const LOGISTIQUE_ANCHORS=['','Très difficile','Difficile','Possible','Facile','Très facile et proche'];
let _idc=Date.now();
function makeId(){return 'p'+(++_idc);}
function makeExpId(){return 'e'+(++_idc);}
function defaultState(){
  return{people:DEFAULT_PEOPLE.map(n=>({id:makeId(),name:n})),scores:{},comparisons:{},experiences:DEFAULT_EXP,personExperiences:{},profiles:{},weights:{envie:40,prob:30,momentum:20,logistique:10}};
}
const KEY='relations_v4';
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const p=JSON.parse(raw);
      if(p.people&&p.people.length>0){
        if(p.people.some(x=>!x.id||!x.id.startsWith('p')))return{...defaultState(),people:p.people.map(x=>({id:makeId(),name:x.name}))};
        if(!p.experiences)p.experiences=DEFAULT_EXP;
        if(!p.personExperiences)p.personExperiences={};
        if(!p.profiles)p.profiles={};
        if(!p.weights)p.weights={envie:40,prob:30,momentum:20,logistique:10};
        // Purge tie comparisons on load — add them back to pending
        const purged={};
        for(const[k,v]of Object.entries(p.comparisons||{})){
          if(v.envie!=='tie'&&v.prob!=='tie')purged[k]=v;
        }
        p.comparisons=purged;
        return p;
      }
    }
  }catch(e){}
  return defaultState();
}
let state=normalizeStateShape(loadData());


// ===== STATE HYGIENE & METRICS =====
function emptyProfile(){return{momentum:0,logistique:0,nextStep:'',relationType:'mixte',lastContact:'',paused:false};}
function normalizeStateShape(s){
  if(!s||typeof s!=='object')s=defaultState();
  if(!Array.isArray(s.people))s.people=[];
  s.people=s.people.filter(p=>p&&p.name).map(p=>({id:p.id&&String(p.id).startsWith('p')?p.id:makeId(),name:String(p.name),active:p.active!==false}));
  if(!s.scores||typeof s.scores!=='object')s.scores={};
  if(!s.comparisons||typeof s.comparisons!=='object')s.comparisons={};
  if(!Array.isArray(s.experiences))s.experiences=DEFAULT_EXP.map(e=>({...e}));
  if(!s.personExperiences||typeof s.personExperiences!=='object')s.personExperiences={};
  if(!s.profiles||typeof s.profiles!=='object')s.profiles={};
  if(!s.weights||typeof s.weights!=='object')s.weights={envie:40,prob:30,momentum:20,logistique:10};
  const purged={};
  for(const[k,v]of Object.entries(s.comparisons||{})){
    if(v&&v.envie!=='tie'&&v.prob!=='tie')purged[k]=v;
  }
  s.comparisons=purged;
  for(const p of s.people){
    if(!s.profiles[p.id])s.profiles[p.id]=emptyProfile();
    s.profiles[p.id]={...emptyProfile(),...s.profiles[p.id]};
    if(!['pro','perso','mixte'].includes(s.profiles[p.id].relationType))s.profiles[p.id].relationType='mixte';
    if(typeof s.profiles[p.id].paused!=='boolean')s.profiles[p.id].paused=(p.active===false);
    if(!Array.isArray(s.personExperiences[p.id]))s.personExperiences[p.id]=[];
  }
  return s;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp01(v){return Math.max(0,Math.min(1,Number.isFinite(v)?v:0));}
function pct(v){return Math.round(clamp01(v)*100);}
function getName(id){const p=state.people.find(p=>p.id===id);return p?p.name:id;}
function getWR(id,dim){const s=state.scores[id];if(!s)return 0;const c=s[dim+'_count']||0;return c===0?0:(s[dim]||0)/c;}
function getPrio(id){return getWR(id,'envie')*getWR(id,'prob');}
function getProfile(pid){
  if(!state.profiles)state.profiles={};
  if(!state.profiles[pid])state.profiles[pid]=emptyProfile();
  state.profiles[pid]={...emptyProfile(),...state.profiles[pid]};
  return state.profiles[pid];
}
function getExperienceCount(pid){return (state.personExperiences&&state.personExperiences[pid]?state.personExperiences[pid]:[]).length;}
function getCompleteness(id){const s=state.scores[id];if(!s)return 0;return Math.min(1,(s.envie_count||0)/Math.max(1,state.people.length-1));}
function getGlobalScore(id){
  const w=state.weights||{envie:40,prob:30,momentum:20,logistique:10},t=(+w.envie||0)+(+w.prob||0)+(+w.momentum||0)+(+w.logistique||0);
  if(t===0)return 0;
  const pr=getProfile(id);
  return clamp01((getWR(id,'envie')*(+w.envie||0)+getWR(id,'prob')*(+w.prob||0)+(pr.momentum/5)*(+w.momentum||0)+(pr.logistique/5)*(+w.logistique||0))/t);
}
function getQualityScore(id){
  const pr=getProfile(id), exp=Math.min(1,getExperienceCount(id)/6), comp=getCompleteness(id);
  return clamp01(getWR(id,'envie')*0.35+(pr.momentum/5)*0.25+exp*0.25+comp*0.15);
}
function getEnergyScore(id){const pr=getProfile(id);return clamp01(getWR(id,'envie')*0.55+(pr.momentum/5)*0.45);}
function getProximityScore(id){const pr=getProfile(id);return clamp01((pr.logistique/5)*0.7+getWR(id,'prob')*0.3);}
function getOpportunityScore(id){const pr=getProfile(id);return clamp01(getWR(id,'prob')*0.5+(pr.logistique/5)*0.25+(pr.momentum/5)*0.25);}
function getRelationMetrics(p){
  const pr=getProfile(p.id);
  const interest=clamp01(getWR(p.id,'envie')*0.7+getEnergyScore(p.id)*0.3);
  const potential=getOpportunityScore(p.id);
  return{person:p,profile:pr,interest,potential,global:getGlobalScore(p.id),quality:getQualityScore(p.id),energy:getEnergyScore(p.id),proximity:getProximityScore(p.id),opportunity:potential,priority:interest*potential,experienceCount:getExperienceCount(p.id),completeness:getCompleteness(p.id)};
}
function relationTypeLabel(t){return t==='pro'?'Pro':t==='perso'?'Perso':'Mixte';}

function getTotalPairs(){const n=getActivePeople().length;return n*(n-1)/2;}
function getDonePairs(){const activeIds=new Set(getActivePeople().map(p=>p.id));return Object.entries(state.comparisons).filter(([key])=>{const [a,b]=key.split('|');return activeIds.has(a)&&activeIds.has(b);}).length;}
function getPendingPairs(){
  const ids=getActivePeople().map(p=>p.id),pairs=[];
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    if(!state.comparisons[ids[i]+'|'+ids[j]]&&!state.comparisons[ids[j]+'|'+ids[i]])pairs.push([ids[i],ids[j]]);
  }
  for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}
  return pairs;
}
function ensureScore(id){if(!state.scores[id])state.scores[id]={envie:0,prob:0,envie_count:0,prob_count:0};}
function recordComparison(id1,id2,eW,pW){
  // Recompute scores from scratch to stay consistent
  state.comparisons[id1+'|'+id2]={envie:eW,prob:pW,ts:Date.now()};
  recomputeScores();
  saveData();
}
function recomputeScores(){
  state.scores={};
  for(const p of state.people)ensureScore(p.id);
  for(const[key,val]of Object.entries(state.comparisons)){
    const[id1,id2]=key.split('|');
    if(!state.scores[id1])ensureScore(id1);
    if(!state.scores[id2])ensureScore(id2);
    const eW=val.envie,pW=val.prob;
    if(eW===id1)state.scores[id1].envie+=1;else if(eW===id2)state.scores[id2].envie+=1;
    state.scores[id1].envie_count++;state.scores[id2].envie_count++;
    if(pW===id1)state.scores[id1].prob+=1;else if(pW===id2)state.scores[id2].prob+=1;
    state.scores[id1].prob_count++;state.scores[id2].prob_count++;
  }
}

function getHeatIcon(pid){

  if(n<=4)return '☀️';
  if(n<=6)return '🔆';

}

}
function makeRankList(sorted,dim,color){
  return sorted.map((p,i)=>{
    const val=dim==='global'?getGlobalScore(p.id):dim==='pri'?getPrio(p.id):getWR(p.id,dim);
    const comps=state.scores[p.id]?(state.scores[p.id].envie_count||0):0;
    const ratio=comps/(Math.max(1,getVisiblePeople().length-1));
    const rCls=ratio>=0.5?'rel-high':ratio>=0.2?'rel-mid':'rel-low';
    const rLbl=ratio>=0.5?'●●●':ratio>=0.2?'●●○':'●○○';
    const heat=getHeatIcon(p.id);
    return`<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-name">${p.name}${isPausedPerson(p)?'<span class="rel-badge rel-low">pause</span>':''}<span class="rel-badge ${rCls}">${rLbl}</span></span>${heat?`<span style="font-size:16px;flex-shrink:0">${heat}</span>`:''}<span class="rank-score" style="color:${color}">${(val*100).toFixed(0)}%</span></div>`;
  }).join('');
}

let sessionPairs=[],sessionIdx=0,currentEnvie=null;

function renderCompare(){
  const el=document.getElementById('compare-content');
  if(getActivePeople().length<2){
    el.innerHTML=`<div class="done-panel"><h2>Aucune donnee chargee</h2><p>Il faut au moins deux personnes actives. Va dans Gerer pour importer un JSON ou reactiver des personnes.</p><button class="btn-primary" onclick="switchTab('manage',document.querySelectorAll('.tab')[6])">Importer un JSON</button></div>`;

  }
  const total=getTotalPairs(),done=getDonePairs(),pct=total>0?Math.round(done/total*100):100;

  if(!pair){
    el.innerHTML=`<div class="done-panel"><h2>Toutes les comparaisons faites ✓</h2><p>${done} paires sur ${total}.</p><button class="btn-primary" onclick="switchTab('rankings',document.querySelectorAll('.tab')[1])">Voir les classements</button></div>`;

    <div class="action-row"><button class="btn-ghost" onclick="skipPair()">Passer</button></div>`;
}
function choose(id){
  if(!currentEnvie){currentEnvie=id;renderCompare();}
  else{validate(currentEnvie,id);}
}
function validate(eW,pW){
  const pair=sessionPairs[sessionIdx];
  recordComparison(pair[0],pair[1],eW,pW);
  currentEnvie=null;sessionIdx++;
  if(sessionIdx>=sessionPairs.length){sessionPairs=getPendingPairs().slice(0,10);sessionIdx=0;}
  renderCompare();
}
function skipPair(){
  currentEnvie=null;sessionIdx++;
  if(sessionIdx>=sessionPairs.length){sessionPairs=getPendingPairs().slice(0,10);sessionIdx=0;}
  renderCompare();
}

  if(kind==='pro')return `Bonjour ${name}, je serais heureux d'échanger avec toi sur tes priorités du moment et de voir s'il existe un angle utile pour avancer concrètement.`;
  return `Bonjour ${name}, je te propose que l'on se cale un moment simple prochainement. J'aimerais beaucoup reprendre le fil et voir ce qui serait utile pour la suite.`;

function buildRecommendations(rows){
  const all=[...rows];
  return{
    activate:all.filter(r=>r.global>=0.45||r.priority>=0.30).sort((a,b)=>(b.global+b.priority)-(a.global+a.priority)).slice(0,5),
    test:all.filter(r=>r.potential>=0.50&&r.interest<0.55).sort((a,b)=>b.potential-a.potential).slice(0,5),
    reactivate:all.filter(r=>r.energy>=0.45&&r.profile.momentum<=2).sort((a,b)=>b.energy-a.energy).slice(0,5),
    reevaluate:all.filter(r=>r.completeness>=0.2&&r.global<0.25).sort((a,b)=>a.global-b.global).slice(0,5),
    week:all.filter(r=>r.profile.nextStep||r.global>=0.45||r.priority>=0.28||r.profile.momentum>=4).sort((a,b)=>{
      const ns=(b.profile.nextStep?0.25:0)-(a.profile.nextStep?0.25:0);
      return (b.global+b.priority+ns)-(a.global+a.priority);
    }).slice(0,7)
  };
}

function matrixPersonLine(r,color){return `<div class="rank-item" onclick="selectedDotId='${r.person.id}';renderMatrix()" style="cursor:pointer"><span class="rank-name">${esc(r.person.name)} <span class="rel-badge ${r.profile.relationType==='pro'?'rel-high':r.profile.relationType==='perso'?'rel-mid':'rel-low'}">${relationTypeLabel(r.profile.relationType)}</span></span><span class="rank-score" style="color:${color}">G:${pct(r.global)}%</span></div>`;}
function recommendationCard(title,rows,empty,kind){
  return `<div class="reco-card"><div class="reco-head">${title}</div>${rows.length?rows.map(r=>`<div class="reco-item" style="align-items:flex-start"><div style="flex:1"><div class="reco-name">${esc(r.person.name)}</div><div class="reco-reason">G:${pct(r.global)}% · Int:${pct(r.interest)}% · Pot:${pct(r.potential)}% · Q:${pct(r.quality)}%</div>${r.profile.nextStep?`<div class="reco-reason" style="color:#c77dff;margin-top:3px">Next: ${esc(r.profile.nextStep)}</div>`:''}</div><button class="history-redo" onclick="setQuickNextStep('${r.person.id}',\`${esc(buildMessageSuggestion(r,kind)).replace(/`/g,'&#96;')}\`)">Suggérer</button></div>`).join(''):`<div style="padding:13px 14px;color:#6b6b80;font-size:12px">${empty}</div>`}</div>`;
}
function renderMatrix(){
  const el=document.getElementById('matrix-content');
  if(!state.people.length){el.innerHTML=`<div class="done-panel"><h2>Aucune donnée chargée</h2><p>Importe ta sauvegarde JSON depuis l'onglet Gérer pour afficher la matrice.</p><button class="btn-primary" onclick="switchTab('manage',document.querySelectorAll('.tab')[6])">Importer mes données</button></div>`;return;}
  if(!getVisiblePeople().length){el.innerHTML=peopleStatusControls()+`<div class="done-panel"><h2>Aucun profil dans ce filtre</h2><p>Change le filtre Actifs / Inactifs / Tous, ou réactive une personne dans Gérer.</p></div>`;return;}
  const rows=getFilteredMetrics();
  const allRows=getVisiblePeople().map(getRelationMetrics);
  const recs=buildRecommendations(rows);
  const qGroups={strategic:[],interest:[],potential:[],low:[]};
  rows.forEach(r=>qGroups[quadrantOf(r)].push(r));
  Object.values(qGroups).forEach(a=>a.sort((x,y)=>(y.priority+y.global)-(x.priority+x.global)));
  const colors=['#e8a838','#4ea8de','#56cf85','#ff6b6b','#c77dff','#ff9f43','#a29bfe','#fd79a8','#00cec9','#e17055'];
  const dotsHtml=rows.map((r,i)=>{
    const x=Math.max(5,Math.min(95,pct(r.potential))), y=Math.max(5,Math.min(95,pct(r.interest))), color=colors[i%colors.length];
    const initials=r.person.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const selected=selectedDotId===r.person.id;
    return `<button title="${esc(r.person.name)}" class="matrix-dot${selected?' selected':''}" style="left:${x}%;bottom:${y}%;background:${color}33;border-color:${color};color:${color};font-size:8px" onclick="selectDot('${r.person.id}')">${esc(initials)}</button>`;
  }).join('');
  const selected=allRows.find(r=>r.person.id===selectedDotId)||rows[0];
  const selectedHtml=selected?`<div class="profile-card" style="margin-top:10px"><div class="profile-head"><div><div class="profile-name">${esc(selected.person.name)}</div><div class="card-sub">${relationTypeLabel(selected.profile.relationType)} · ${quadrantMeta(quadrantOf(selected)).label}</div></div><div class="profile-scores"><span style="color:#c77dff">G:${pct(selected.global)}%</span><span style="color:#56cf85">Q:${pct(selected.quality)}%</span></div></div><div class="profile-body open">
    ${miniBar('Intérêt',selected.interest,'#e8a838')}${miniBar('Potentiel',selected.potential,'#4ea8de')}${miniBar('Qualité relationnelle',selected.quality,'#56cf85')}${miniBar('Proximité',selected.proximity,'#c77dff')}${miniBar('Énergie',selected.energy,'#ff9f43')}${miniBar('Opportunité',selected.opportunity,'#00cec9')}
    <div style="display:flex;gap:6px;margin:10px 0;flex-wrap:wrap"><button class="history-redo" onclick="setRelationType('${selected.person.id}','pro')">Pro</button><button class="history-redo" onclick="setRelationType('${selected.person.id}','perso')">Perso</button><button class="history-redo" onclick="setRelationType('${selected.person.id}','mixte')">Mixte</button></div>
    <div class="next-step-label">📌 Prochain step</div><textarea class="next-step-input" oninput="setNextStep('${selected.person.id}',this.value)" placeholder="Ex: proposer un café, envoyer un message, planifier un appel...">${esc(selected.profile.nextStep||'')}</textarea>
    <div class="next-step-label" style="margin-top:10px">💬 Suggestion de message</div><div style="background:#1e1e24;border:1px solid #2a2a35;border-radius:8px;padding:10px;font-size:12px;line-height:1.5;color:#a0a0b8">${esc(buildMessageSuggestion(selected,selected.profile.relationType==='pro'?'pro':'generic'))}</div>
    <button class="btn-export" style="margin-top:8px" onclick="setQuickNextStep('${selected.person.id}',\`${esc(buildMessageSuggestion(selected,'generic')).replace(/`/g,'&#96;')}\`)">Utiliser comme prochain step</button>
  </div></div>`:'';
  function filterButton(value,label){const active=matrixTypeFilter===value;return `<button onclick="setMatrixTypeFilter('${value}')" style="padding:8px 10px;border-radius:8px;border:1px solid ${active?'#c77dff':'#2a2a35'};background:${active?'rgba(199,125,255,0.1)':'transparent'};color:${active?'#c77dff':'#6b6b80'};font-family:inherit;font-size:12px;cursor:pointer">${label}</button>`;}
  function qCard(key){const meta=quadrantMeta(key),arr=qGroups[key];return `<div class="card"><div class="card-head"><span style="font-size:19px">${meta.icon}</span><div><div class="card-title" style="color:${meta.color}">${meta.label}</div><div class="card-sub">${meta.desc} · ${arr.length} profil${arr.length>1?'s':''}</div></div></div>${arr.length?arr.slice(0,8).map(r=>matrixPersonLine(r,meta.color)).join(''):`<div style="padding:12px 14px;color:#6b6b80;font-size:12px">Aucun profil dans ce quadrant.</div>`}</div>`;}
  const topTable=[...rows].sort((a,b)=>b.global-a.global).slice(0,12).map((r,i)=>`<div class="rank-item"><span class="rank-num">${i+1}</span><span class="rank-name">${esc(r.person.name)}</span><span class="rank-score" style="color:#c77dff">G:${pct(r.global)}%</span><span class="rank-score" style="color:#e8a838">I:${pct(r.interest)}%</span><span class="rank-score" style="color:#4ea8de">P:${pct(r.potential)}%</span></div>`).join('');
  el.innerHTML=`
    <div class="section-title">Classement & Priorisation intelligente</div>
    ${peopleStatusControls()}
    <div class="stats-bar"><div><span class="stat-val">${rows.length}</span><span class="stat-lab">${peopleStatusLabel()}</span></div><div><span class="stat-val">${pct(rows.reduce((a,r)=>a+r.global,0)/Math.max(1,rows.length))}%</span><span class="stat-lab">Score moyen</span></div><div><span class="stat-val">${recs.week.length}</span><span class="stat-lab">À contacter</span></div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${filterButton('all','Tous')}${filterButton('pro','Pro')}${filterButton('perso','Perso')}${filterButton('mixte','Mixte')}</div>
    <input class="search-input" placeholder="Filtrer une personne dans la matrice..." value="${esc(matrixSearch)}" oninput="setMatrixSearch(this.value)">
    <div class="card"><div class="card-head"><span style="font-size:19px">🏆</span><div><div class="card-title" style="color:#c77dff">Tableau global trié par Score Global</div><div class="card-sub">Global · Intérêt · Potentiel</div></div></div>${topTable||'<div style="padding:14px;color:#6b6b80">Aucun profil avec ces filtres.</div>'}</div>
    <div class="section-title" style="margin-top:14px">Matrice à 4 quadrants</div>
    <p style="font-size:11px;color:#6b6b80;margin-bottom:8px">Axe vertical : intérêt. Axe horizontal : potentiel. Clique sur une bulle pour ouvrir le détail.</p>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px"><span style="font-size:10px;color:#6b6b80;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:1px;text-transform:uppercase;flex-shrink:0">Intérêt ↑</span><div style="flex:1"><div class="matrix-wrap"><div class="matrix-quadrant mq-tl" style="color:#e8a83877">Intérêt fort</div><div class="matrix-quadrant mq-tr" style="color:#56cf8577">Priorité stratégique</div><div class="matrix-quadrant mq-bl" style="color:#6b6b8077">À réévaluer</div><div class="matrix-quadrant mq-br" style="color:#4ea8de77">Potentiel à tester</div>${dotsHtml}</div><div style="font-size:10px;color:#6b6b80;text-align:center;text-transform:uppercase;letter-spacing:1px;margin-top:4px">Potentiel →</div></div></div>
    ${selectedHtml}
    <div class="section-title" style="margin-top:14px">Analyse par quadrant</div><div class="rank-grid">${qCard('strategic')}${qCard('interest')}${qCard('potential')}${qCard('low')}</div>
    <div class="section-title" style="margin-top:14px">Recommandations automatiques hebdomadaires</div>
    ${recommendationCard('⚡ Top connexions à activer en priorité',recs.activate,'Aucune priorité forte pour ce filtre.','pro')}
    ${recommendationCard('🧪 Profils à tester rapidement',recs.test,'Aucun profil à tester rapidement.','test')}
    ${recommendationCard('🔄 Recommandations de relance',recs.reactivate,'Aucune relance évidente détectée.','reactivate')}
    ${recommendationCard('🧭 Connexions à réévaluer',recs.reevaluate,'Aucune connexion à réévaluer détectée.','generic')}
    <div class="section-title" style="margin-top:14px">Personnes à contacter cette semaine</div>
    ${recommendationCard('📅 Plan de contact hebdomadaire',recs.week,'Rien d’urgent cette semaine.','generic')}
    <div class="backup-zone"><div class="backup-head">Export synthèse relationnelle</div><div class="backup-body"><div class="backup-row"><p>Exporte une synthèse Markdown des priorités, quadrants et prochains steps.</p><button class="btn-export" onclick="exportRelationSummary()">↓ Exporter la synthèse</button></div></div></div>`;
}
function exportRelationSummary(){
  const rows=getFilteredMetrics().sort((a,b)=>b.global-a.global),recs=buildRecommendations(rows);
  const line=r=>`- ${r.person.name} | Global ${pct(r.global)}% | Intérêt ${pct(r.interest)}% | Potentiel ${pct(r.potential)}% | Qualité ${pct(r.quality)}% | Type ${relationTypeLabel(r.profile.relationType)}${r.profile.nextStep?` | Next: ${r.profile.nextStep}`:''}`;
  const md=[`# Synthèse relationnelle - ${new Date().toISOString().slice(0,10)}`,'',`Profils analysés : ${rows.length} (${peopleStatusLabel()})`,'','## Top connexions à activer',...recs.activate.map(line),'','## Profils à tester rapidement',...recs.test.map(line),'','## Relations à relancer',...recs.reactivate.map(line),'','## Connexions à réévaluer',...recs.reevaluate.map(line),'','## Personnes à contacter cette semaine',...recs.week.map(line)].join('\n');
  const blob=new Blob([md],{type:'text/markdown'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='synthese-relations-'+new Date().toISOString().slice(0,10)+'.md';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showFlash('Synthèse exportée');
}

// ===== PROFILES — search with stable input =====
let profileSearch='',profileOpenId=null;
function renderProfiles(){
  const el=document.getElementById('profiles-content');
  const basePeople=getVisiblePeople();
  const filtered=profileSearch?basePeople.filter(p=>p.name.toLowerCase().includes(profileSearch.toLowerCase())):basePeople;
  // Render search input separately to preserve focus
  let searchEl=document.getElementById('profile-search-input');
  if(!searchEl){
    el.innerHTML=`<div class="section-title">Notes & Scores manuels</div>${peopleStatusControls()}<input id="profile-search-input" class="search-input" placeholder="Rechercher…"><div id="profile-list"></div>`;
    searchEl=document.getElementById('profile-search-input');
    searchEl.addEventListener('input',function(){profileSearch=this.value;renderProfileList();});
  }
  searchEl.value=profileSearch;
  renderProfileList();
}
function renderProfileList(){
  const el=document.getElementById('profile-list');
  if(!el)return;
  const basePeople=getVisiblePeople();
  const filtered=profileSearch?basePeople.filter(p=>p.name.toLowerCase().includes(profileSearch.toLowerCase())):basePeople;
  el.innerHTML=filtered.map(p=>{
    const pr=getProfile(p.id);
    const gs=(getGlobalScore(p.id)*100).toFixed(0);
    const isOpen=profileOpenId===p.id;
    return`<div class="profile-card">
      <div class="profile-head" onclick="profileOpenId=profileOpenId==='${p.id}'?null:'${p.id}';renderProfileList()">
        <span class="profile-name">${p.name}</span>
        <div class="profile-scores"><span style="color:#c77dff">${gs}%</span><span style="color:#e8a838">${pr.momentum?'⚡'.repeat(pr.momentum):'—'}</span></div>
      </div>
      <div class="profile-body ${isOpen?'open':''}">
        <div class="rating-row">
          <div class="rating-label">⚡ Momentum actuel</div>
          <div class="rating-desc">${pr.momentum?MOMENTUM_ANCHORS[pr.momentum]:MOMENTUM_ANCHORS[1]}</div>
          <div class="rating-stars">${[1,2,3,4,5].map(v=>`<button class="star-btn ${pr.momentum>=v?'active':''}" onclick="setRating('${p.id}','momentum',${v})">${v}</button>`).join('')}</div>
        </div>
        <div class="rating-row" style="margin-bottom:14px">
          <div class="rating-label">🗺️ Facilité logistique</div>
          <div class="rating-desc">${pr.logistique?LOGISTIQUE_ANCHORS[pr.logistique]:LOGISTIQUE_ANCHORS[1]}</div>
          <div class="rating-stars">${[1,2,3,4,5].map(v=>`<button class="star-btn ${pr.logistique>=v?'active':''}" onclick="setRating('${p.id}','logistique',${v})">${v}</button>`).join('')}</div>
        </div>
        <div class="next-step-label">📌 Prochain step</div>
        <textarea class="next-step-input" placeholder="Ex: Proposer un café ce mois-ci…" oninput="setNextStep('${p.id}',this.value)">${pr.nextStep||''}</textarea>
        <div style="font-size:11px;color:#6b6b80;margin-top:8px">E:${(getWR(p.id,'envie')*100).toFixed(0)}% · P:${(getWR(p.id,'prob')*100).toFixed(0)}% · M:${pr.momentum}/5 · L:${pr.logistique}/5 · <span style="color:#c77dff">Global:${gs}%</span></div>
      </div>
    </div>`;
  }).join('');
}
function setRating(pid,dim,val){
  if(!state.profiles[pid])state.profiles[pid]={momentum:0,logistique:0,nextStep:''};
  state.profiles[pid][dim]=val;
  saveData();renderProfileList();
}
function setNextStep(pid,val){
  if(!state.profiles[pid])state.profiles[pid]={momentum:0,logistique:0,nextStep:''};
  state.profiles[pid].nextStep=val;
  saveData();
}

  const el=document.getElementById('exp-content');
  const glossHtml=`<div class="section-title">Glossaire des expériences</div>

    searchEl=document.getElementById('exp-search-input');

function renderExpByExp(){
  const el=document.getElementById('exp-by-exp-list');

      </div>
      <div class="person-exp-body ${isSel?'open':''}">
        ${people.length===0?'<div style="color:#6b6b80;font-size:12px;padding:4px 0">Aucune personne cochée.</div>':

            <span style="font-size:11px;color:#c77dff">${(getGlobalScore(p.id)*100).toFixed(0)}%</span>
          </div>`).join('')}

function renderExpList(){
  const el=document.getElementById('exp-person-list');
  if(!el)return;
  const basePeople=getVisiblePeople();
  const filtered=expSearch?basePeople.filter(p=>p.name.toLowerCase().includes(expSearch.toLowerCase())):basePeople;
  el.innerHTML=filtered.map(p=>{
    const checked=state.personExperiences[p.id]||[];
    const heat=getHeatIcon(p.id);
    const isOpen=expOpenId===p.id;
    return`<div class="person-exp-card">
      <div class="person-exp-head" onclick="expOpenId=expOpenId==='${p.id}'?null:'${p.id}';renderExpList()">
        <span class="person-exp-name">${p.name}</span>
        <span style="font-size:18px">${heat||'<span style="color:#3a3a45;font-size:12px">aucune</span>'}</span>
      </div>
      <div class="person-exp-body ${isOpen?'open':''}">
        <div class="exp-grid">${state.experiences.map(e=>`<div class="exp-check ${checked.includes(e.id)?'checked':''}" onclick="toggleExp('${p.id}','${e.id}')"><span class="exp-check-emoji">${e.emoji}</span><span class="exp-check-label">${e.label}</span></div>`).join('')}</div>
      </div>
    </div>`;

function toggleExp(pid,eid){
  if(!state.personExperiences[pid])state.personExperiences[pid]=[];
  const arr=state.personExperiences[pid],idx=arr.indexOf(eid);
  if(idx===-1)arr.push(eid);else arr.splice(idx,1);
  saveData();renderExpList();
}
function updateExp(eid,field,value){const e=state.experiences.find(x=>x.id===eid);if(e){e[field]=value;saveData();}}
function deleteExp(eid){
  if(!confirm('Supprimer cette expérience ?'))return;
  state.experiences=state.experiences.filter(e=>e.id!==eid);
  for(const pid of Object.keys(state.personExperiences))state.personExperiences[pid]=state.personExperiences[pid].filter(id=>id!==eid);
  saveData();renderExperiences();
}
function addExp(){state.experiences.push({id:makeExpId(),emoji:'⭐',label:'Nouvelle expérience'});saveData();renderExperiences();}

// ===== HISTORY =====
let histFilter='';
function renderHistory(){
  const el=document.getElementById('history-content');
  let searchEl=document.getElementById('hist-search-input');
  if(!searchEl){
    el.innerHTML=`<div class="section-title">Historique des comparaisons</div>${peopleStatusControls()}<input id="hist-search-input" class="search-input" placeholder="Filtrer par prénom…"><div id="hist-list" class="card"></div>`;
    searchEl=document.getElementById('hist-search-input');
    searchEl.addEventListener('input',function(){histFilter=this.value;renderHistList();});
  }
  searchEl.value=histFilter;
  renderHistList();
}
function renderHistList(){
  const el=document.getElementById('hist-list');
  if(!el)return;
  const entries=Object.entries(state.comparisons).map(([key,val])=>{
    const[id1,id2]=key.split('|');
    return{id1,id2,key,...val};
  }).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const visibleIds=new Set(getVisiblePeople().map(p=>p.id));
  let scoped=entries.filter(e=>peopleStatusFilter==='all'||(visibleIds.has(e.id1)&&visibleIds.has(e.id2)));
  const filtered=histFilter?scoped.filter(e=>getName(e.id1).toLowerCase().includes(histFilter.toLowerCase())||getName(e.id2).toLowerCase().includes(histFilter.toLowerCase())):scoped;
  el.innerHTML=`<div style="padding:9px 14px;border-bottom:1px solid #2a2a35;font-size:10px;color:#6b6b80;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:1px;"><span>${filtered.length} comparaisons</span><span>Refaire = remet en session</span></div>`
    +(filtered.length===0?'<div style="padding:20px;text-align:center;color:#6b6b80">Aucune comparaison trouvée.</div>'
    :filtered.map(e=>`<div class="history-item">
      <div class="history-vs"><div style="font-size:13px">${getName(e.id1)} <span style="color:#6b6b80">vs</span> ${getName(e.id2)}</div><div style="font-size:11px;color:#6b6b80;margin-top:2px">Envie : <span style="color:#e8a838">${e.envie===e.id1?getName(e.id1):getName(e.id2)}</span> · Prob : <span style="color:#4ea8de">${e.prob===e.id1?getName(e.id1):getName(e.id2)}</span></div></div>
      <button class="history-redo" onclick="redoPair('${e.id1}','${e.id2}','${e.key}')">Refaire</button>
    </div>`).join(''));
}
function redoPair(id1,id2,key){
  delete state.comparisons[key];
  recomputeScores();
  saveData();
  sessionPairs=[[id1,id2],...getPendingPairs()].slice(0,10);
  sessionIdx=0;currentEnvie=null;
  switchTab('compare',document.querySelectorAll('.tab')[0]);
  showFlash('Comparaison remise en session');
}

// ===== MANAGE =====
let editingId=null;
function renderManage(){
  const el=document.getElementById('person-list');
  if(!state.people.length){el.innerHTML='<div style="padding:18px;color:#6b6b80;text-align:center">Aucune personne. Importe ta sauvegarde JSON ci-dessous.</div>';return;}
  const sorted=[...state.people].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  const activeCount=getActivePeople().length,inactiveCount=state.people.length-activeCount;
  el.innerHTML=`<div class="person-list-head"><span>${state.people.length} personnes · ${activeCount} actives · ${inactiveCount} en pause</span><span>statut</span></div>`;
  sorted.forEach(p=>{
    const comps=state.scores[p.id]?(state.scores[p.id].envie_count||0):0;
    const row=document.createElement('div');
    row.className='person-row'+(editingId===p.id?' editing':'');
    if(editingId===p.id){
      const inp=document.createElement('input');inp.className='edit-input';inp.value=p.name;
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')saveName(p.id,inp.value);if(e.key==='Escape'){editingId=null;renderManage();}});
      const btnS=document.createElement('button');btnS.className='btn-save';btnS.textContent='✓';btnS.onclick=()=>saveName(p.id,inp.value);
      const btnC=document.createElement('button');btnC.className='btn-cancel-sm';btnC.textContent='✕';btnC.onclick=()=>{editingId=null;renderManage();};
      row.appendChild(inp);row.appendChild(btnS);row.appendChild(btnC);
      el.appendChild(row);setTimeout(()=>inp.focus(),50);
    }else{
      const nEl=document.createElement('span');nEl.className='person-name';nEl.textContent=p.name;
      const cEl=document.createElement('span');cEl.className='person-comps';cEl.textContent=(isPausedPerson(p)?'pause · ':'actif · ')+comps+' comp.';
      const bP=document.createElement('button');bP.className='icon-btn';bP.textContent=isPausedPerson(p)?'▶':'⏸';bP.title=isPausedPerson(p)?'Réactiver':'Mettre en pause';bP.style.color=isPausedPerson(p)?'#56cf85':'#e8a838';bP.onclick=()=>setPausedPerson(p.id,!isPausedPerson(p));
      const bE=document.createElement('button');bE.className='icon-btn';bE.textContent='✎';bE.style.color='#4ea8de';bE.onclick=()=>{editingId=p.id;renderManage();};
      const bD=document.createElement('button');bD.className='icon-btn';bD.textContent='×';bD.style.color='#ff6b6b';bD.onclick=()=>deletePerson(p.id);
      row.appendChild(nEl);row.appendChild(cEl);row.appendChild(bP);row.appendChild(bE);row.appendChild(bD);
      el.appendChild(row);
    }
  });
}
function addPerson(){
  const inp=document.getElementById('new-name'),name=inp.value.trim();
  if(!name)return;
  if(state.people.some(p=>p.name.toLowerCase()===name.toLowerCase())){showFlash('Déjà dans la liste');return;}
  state.people.push({id:makeId(),name,active:true});saveData();inp.value='';initSession();renderManage();showFlash('Ajouté : '+name);
}
function saveName(id,newName){
  newName=newName.trim();if(!newName)return;
  if(state.people.some(p=>p.id!==id&&p.name.toLowerCase()===newName.toLowerCase())){showFlash('Ce nom existe déjà');return;}
  const p=state.people.find(p=>p.id===id);if(p)p.name=newName;
  saveData();editingId=null;renderManage();showFlash('Nom modifié');
}
function deletePerson(id){
  if(!confirm('Supprimer cette personne ?'))return;
  state.people=state.people.filter(p=>p.id!==id);
  delete state.scores[id];delete state.personExperiences[id];delete state.profiles[id];
  for(const key of Object.keys(state.comparisons)){const pts=key.split('|');if(pts[0]===id||pts[1]===id)delete state.comparisons[key];}
  recomputeScores();saveData();editingId=null;initSession();renderManage();showFlash('Supprimé');
}
function resetScores(){
  if(!confirm('Réinitialiser tous les scores ?'))return;
  state.scores={};state.comparisons={};saveData();initSession();renderManage();showFlash('Réinitialisé');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='relations-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showFlash('Exporté');
}
function importJSON(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const p=JSON.parse(e.target.result);
      if(!p.people||!Array.isArray(p.people))throw new Error('Format invalide');
      if(!confirm('Remplacer les données actuelles ?'))return;
      state=normalizeStateShape(p);
      recomputeScores();saveData();initSession();renderManage();renderActiveView();showFlash('Importé — '+state.people.length+' personnes, dont '+getActivePeople().length+' actives');
    }catch(err){alert('Fichier invalide : '+err.message);}
  };
  reader.readAsText(file);event.target.value='';
}

// ===== INIT =====
recomputeScores();
initSession();
renderCompare();
renderManage();
</script>
</body>
</html>
